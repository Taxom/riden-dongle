name: Firmware regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esp12e-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: pio run -e esp12e
        env:
          VERSION: upstream-review
      - run: python test/host/run_all_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-esp12e-firmware
          path: .pio/build/esp12e/firmware_*.bin
