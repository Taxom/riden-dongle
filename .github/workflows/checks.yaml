name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp12e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ESP-12E / ESP-12F firmware
        run: pio run -e esp12e
        env:
          VERSION: 1.7.0-taxom.12
      - name: Test overlapping TCP and local UART transactions
        run: python test/host/run_tests.py
      - name: Test desktop multi-client control tool offline
        run: python tools/multi_client_test/tests/test_multi_client_tool.py
      - name: Test final acceptance tool with mode switching and invalid inputs
        run: python tools/final_acceptance_test/tests/test_final_test.py
      - name: Record firmware checksum
        run: sha256sum .pio/build/esp12e/firmware_*.bin > .pio/build/esp12e/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: riden-dongle-esp12e-taxom
          path: |
            .pio/build/esp12e/firmware_*.bin
            .pio/build/esp12e/firmware_*.bin.gz
            .pio/build/esp12e/SHA256SUMS

  homeassistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: homeassistant/requirements-dev.txt
      - name: Install HA test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test real HA entities, recovery and Modbus protocol
        run: pytest -p pytest_asyncio.plugin tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - name: Lint and check source syntax
        run: |
          ruff check custom_components tests build_package.py
          python -m compileall -q custom_components
          sh -n install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: homeassistant/package-lock.json
      - name: Install card test dependencies
        run: npm ci --ignore-scripts
      - name: Test card DOM and offline recovery
        run: npm test
      - name: Build standalone HA installation ZIP
        run: python build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: rd6006p-homeassistant
          path: |
            dist/RD6006P_HA_v*.zip
            dist/RD6006P_HA_v*.zip.sha256
