name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp12e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt
      - name: Build ESP-12E / ESP-12F firmware
        run: pio run -e esp12e
        env:
          VERSION: 1.7.0-taxom.5
      - name: Test overlapping TCP and local UART transactions
        run: python test/host/run_tests.py
      - name: Record firmware checksum
        run: sha256sum .pio/build/esp12e/firmware_*.bin > .pio/build/esp12e/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: riden-dongle-esp12e-taxom
          path: |
            .pio/build/esp12e/firmware_*.bin
            .pio/build/esp12e/firmware_*.bin.gz
            .pio/build/esp12e/SHA256SUMS
